name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Tests (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, mbstring
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Run tests
        run: php artisan test

  tests-js:
    name: Tests JS (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Vitest
        run: npm run test:js -- --run
      # Que un JSX roto tumbe el CI es la mitad del valor de este job.
      - name: Build frontend
        run: npm run build
      # El glob de páginas llegó a arrastrar los __tests__ al bundle de
      # producción: 333 KB -> 861 KB con testing-library y axe dentro, y
      # `vite build` salía con código 0. Ni Vitest ni el build lo detectan,
      # así que el guardián va aquí.
      - name: El bundle no puede contener las herramientas de prueba
        run: |
          if grep -rlq "testing-library\|axe-core\|vitest" public/build/assets/*.js; then
            echo "El bundle contiene código de pruebas: revisa el glob de app.jsx"; exit 1
          fi
      # El presupuesto lo mide un script que lee el MANIFEST (todo el JS que
      # baja un navegador), no `stat` de un solo `app-*.js` — que desde el
      # troceo de #29 es solo el marco y dejaba la cuenta ciega. Dos techos:
      # total ≤ 450 KB y ninguna página > 40 KB.
      - name: Presupuesto de bundle (total ≤ 450 KB, página ≤ 40 KB)
        run: node scripts/presupuesto-bundle.mjs

  postgres:
    name: Migraciones + seed (PostgreSQL 16 + ltree)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: allyu
          POSTGRES_PASSWORD: allyu
          POSTGRES_DB: allyuhub
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U allyu"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, mbstring
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare env
        run: |
          cp .env.example .env
          php artisan key:generate
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=pgsql/' .env
          echo -e "DB_HOST=127.0.0.1\nDB_PORT=5432\nDB_DATABASE=allyuhub\nDB_USERNAME=allyu\nDB_PASSWORD=allyu" >> .env
      - name: Create extensions
        run: |
          PGPASSWORD=allyu psql -h 127.0.0.1 -U allyu -d allyuhub -c "CREATE EXTENSION IF NOT EXISTS ltree; CREATE EXTENSION IF NOT EXISTS pg_trgm;"
          PGPASSWORD=allyu createdb -h 127.0.0.1 -U allyu allyuhub_test
          PGPASSWORD=allyu psql -h 127.0.0.1 -U allyu -d allyuhub_test -c "CREATE EXTENSION IF NOT EXISTS ltree; CREATE EXTENSION IF NOT EXISTS pg_trgm;"
      - name: Migrate + seed (el grafo completo contra pgsql real)
        run: php artisan migrate --seed --force
      # `migrate --seed` valida el ESQUEMA, no el COMPORTAMIENTO. Sin este
      # paso, un desajuste de tipos entre columnas (alignments.reviewed_by uuid
      # contra users.id bigint) pasaba los 154 tests en SQLite —que no tipa— y
      # solo reventaba en producción. La suite entera tiene que correr contra
      # la base de datos real.
      - name: Suite completa contra PostgreSQL
        run: php artisan test
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: allyuhub_test
          DB_USERNAME: allyu
          DB_PASSWORD: allyu
      - name: Smoke test de la API
        run: |
          php artisan serve --port=8080 &
          sleep 3
          curl -sf localhost:8080/api/v1/tracks | grep -q 'PCEI-BI'
          curl -sf "localhost:8080/api/v1/objectives/search?q=rozamiento" | grep -q 'CN.F.5.1.12'
