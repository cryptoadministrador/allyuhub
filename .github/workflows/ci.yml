name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Tests (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, mbstring
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Run tests
        run: php artisan test

  postgres:
    name: Migraciones + seed (PostgreSQL 16 + ltree)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: allyu
          POSTGRES_PASSWORD: allyu
          POSTGRES_DB: allyuhub
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U allyu"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, mbstring
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare env
        run: |
          cp .env.example .env
          php artisan key:generate
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=pgsql/' .env
          echo -e "DB_HOST=127.0.0.1\nDB_PORT=5432\nDB_DATABASE=allyuhub\nDB_USERNAME=allyu\nDB_PASSWORD=allyu" >> .env
      - name: Create extensions
        run: PGPASSWORD=allyu psql -h 127.0.0.1 -U allyu -d allyuhub -c "CREATE EXTENSION IF NOT EXISTS ltree; CREATE EXTENSION IF NOT EXISTS pg_trgm;"
      - name: Migrate + seed (el grafo completo contra pgsql real)
        run: php artisan migrate --seed --force
      - name: Smoke test de la API
        run: |
          php artisan serve --port=8080 &
          sleep 3
          curl -sf localhost:8080/api/v1/tracks | grep -q 'PCEI-BI'
          curl -sf "localhost:8080/api/v1/objectives/search?q=rozamiento" | grep -q 'CN.F.5.1.12'
