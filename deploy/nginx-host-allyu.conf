# Fachada del host para AllyuHub (allyu.cuysoft.io) — va en
# /etc/nginx/sites-available/allyu con symlink en sites-enabled.
# Certbot (--nginx) añade después el bloque 443 con el certificado,
# igual que hizo con el vhost `moodle` de e-learnium.edu.ec.
server {
    listen 80;
    server_name allyu.cuysoft.io;

    # ACME de certbot y redirección a https la gestiona certbot al emitir.

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # La app confía en el proxy (bootstrap/app.php) y ESTE header es el
        # que hace que Laravel se sepa https: sin él, la cookie de sesión
        # pierde `Secure` y muere dentro del iframe de Moodle.
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
    }
}
